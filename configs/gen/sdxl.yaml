# SDXL base 1.0 — 2023, larger UNet, two CLIP text encoders (77 tokens each)
name: sdxl
repo: stabilityai/stable-diffusion-xl-base-1.0
revision: null          # TODO: pin after smoke run
variant: fp16
dtype: fp16
# The model card's example calls pipe(prompt) with pipeline defaults: 50 steps, cfg 5.0 (D-006).
# (The M1 smoke run used 30 steps; those images keep their own config_hash.)
steps: 50
cfg: 5.0
height: 1024
width: 1024
batch_size: 2           # D-007
seeds: [0, 1, 2, 3]
# SDXL's VAE overflows in fp16; its config sets force_upcast=true so diffusers decodes in
# fp32. If you still see black/NaN images, swap in an fp16-fixed VAE and log it (guide §6.4).
load_kwargs: {}
call_kwargs: {}
cpu_offload: false
notes: Model-card defaults, no tuning.
