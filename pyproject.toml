[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genprobe"
version = "0.1.0"
description = "Text-to-image/video evaluation, metric meta-evaluation, and a generation-debugging agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Deliberately light: torch/diffusers/t2v-metrics are installed per virtualenv
# (scripts/setup_envs.sh) because their version pins conflict.
dependencies = [
  "pydantic>=2",
  "pyyaml",
  "pillow",
  "numpy",
]

[project.optional-dependencies]
analysis = ["pandas", "pyarrow", "matplotlib"]
dev = ["pytest"]
# The scoring service (genprobe/service, D-040); pinned versions in deploy/requirements-service.txt
service = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "psycopg[binary]>=3.2", "psycopg-pool>=3.2",
           "prometheus-client>=0.20", "python-multipart>=0.0.9", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["genprobe*"]

[tool.setuptools.package-data]
"genprobe.service" = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
